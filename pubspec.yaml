name: uthm_hub
description: A UTHM campus marketplace, services, and transport app
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Flutter & UI
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # Maps & Location
  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.0.0
  geolocator: ^13.0.1
  url_launcher: ^6.3.0
  google_places_flutter: ^2.1.1
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/google.webp
    - assets/images/logo.jpeg
    - assets/images/logo.png